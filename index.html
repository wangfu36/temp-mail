<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>临时邮箱 | 基于 22.Do API</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f3f4f6;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #111827;
            margin-bottom: 8px;
            text-align: center;
        }
        .desc {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .source-tip {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 16px;
        }
        .source-tip a {
            color: #3b82f6;
            text-decoration: none;
        }
        .email-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            font-family: monospace;
            font-size: 18px;
            color: #1f2937;
            word-break: break-all;
            margin-bottom: 16px;
        }
        .btn-group {
            text-align: center;
            margin-bottom: 16px;
        }
        button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 6px 8px;
        }
        .btn-main {
            background: #2563eb;
            color: #fff;
        }
        .btn-main:active {
            background: #1d4ed8;
        }
        .btn-default {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-default:active {
            background: #d1d5db;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .msg {
            text-align: center;
            font-size: 14px;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .msg-success {
            background: #dcfce7;
            color: #16a34a;
        }
        .msg-error {
            background: #fee2e2;
            color: #dc2626;
        }
        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .inbox-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }
        .inbox-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            background: #f9fafb;
        }
        .email-item {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
        }
        .email-item:last-child {
            margin-bottom: 0;
        }
        .email-sub {
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
        }
        .email-meta {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 6px;
        }
        .email-body {
            font-size: 14px;
            color: #374151;
            white-space: pre-wrap;
        }
        .empty-tip {
            text-align: center;
            color: #9ca3af;
            padding: 30px 0;
        }
        .auto-refresh-tip {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 邮箱生成区域 -->
    <div class="card">
        <h1>临时 Gmail 邮箱</h1>
        <div class="source-tip">服务基于 <a href="https://22.do" target="_blank">22.Do</a> API 提供</div>
        <div class="desc">自动生成带随机别名邮箱 | 生成后自动复制</div>

        <div id="emailBox" class="email-box">正在初始化...</div>
        <div id="msgBox" class="msg">请稍候，正在连接接口</div>

        <div class="btn-group">
            <button id="genCopyBtn" class="btn-main" disabled>生成并复制新邮箱</button>
        </div>
    </div>

    <!-- 收件箱区域 -->
    <div class="card">
        <div class="inbox-header">
            <div class="inbox-title">📩 收件箱</div>
            <div>
                <button id="refreshBtn" class="btn-default">手动刷新</button>
                <button id="clearBtn" class="btn-default">清空收件箱</button>
            </div>
        </div>
        <div id="inboxList" class="inbox-list">
            <div class="empty-tip">加载中...</div>
        </div>
        <div class="auto-refresh-tip">自动刷新：开启（10秒/次）</div>
    </div>
</div>

<script>
// ====================== 全局配置（重点修改此处）======================
const CONFIG = {
    // 填入你的 Cloudflare Workers 代理地址（结尾不要加 /）
    PROXY_BASE: "https://xxx.xxx.workers.dev",
    // 你的 22.Do API Token
    USER_API_TOKEN: "af043d0ba55a2cc262aa1caa489e5920",
    // 生成邮箱数量（单次1个即可）
    GEN_NUM: 1,
    // 自动刷新间隔 毫秒
    REFRESH_INTERVAL: 10000
};

// 全局状态
let bearerToken = "";
let tokenExpire = 0;
let currentMail = "";
let refreshTimer = null;

// DOM 元素
const emailBox = document.getElementById("emailBox");
const msgBox = document.getElementById("msgBox");
const genCopyBtn = document.getElementById("genCopyBtn");
const inboxList = document.getElementById("inboxList");
const refreshBtn = document.getElementById("refreshBtn");
const clearBtn = document.getElementById("clearBtn");

// ====================== 工具函数 ======================
// 消息提示
function setMsg(text, isError = false) {
    msgBox.textContent = text;
    msgBox.className = isError ? "msg msg-error" : "msg msg-success";
}

// 复制到剪贴板
async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
        return true;
    } catch (e) {
        const t = document.createElement("textarea");
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
        return true;
    }
}

// 统一请求封装
async function apiReq(path, opt = {}) {
    const now = Math.floor(Date.now() / 1000);
    // Token 过期则重新获取
    if (!bearerToken || now > tokenExpire) {
        await getToken();
    }

    const headers = {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${bearerToken}`,
        ...opt.headers
    };

    const res = await fetch(`${CONFIG.PROXY_BASE}${path}`, {
        ...opt,
        headers
    });
    const data = await res.json();

    if (!res.ok || !data.status) {
        throw new Error(data.msg || `请求错误 ${res.status}`);
    }
    return data;
}

// ====================== API 逻辑 ======================
// 1. 获取 Bearer Token
async function getToken() {
    try {
        const res = await fetch(`${CONFIG.PROXY_BASE}/token`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: CONFIG.USER_API_TOKEN })
        });
        const data = await res.json();
        if (!res.ok || !data.status) throw new Error("Token 获取失败");

        bearerToken = data.data.Bearer;
        tokenExpire = data.data.expireTime;
        setMsg("接口认证成功");
    } catch (err) {
        setMsg(`认证失败：${err.message}`, true);
        throw err;
    }
}

// 2. 生成带别名的 Gmail 邮箱
async function genGmail() {
    try {
        const res = await apiReq("/gmail/generate", {
            method: "POST",
            body: JSON.stringify({
                number: CONFIG.GEN_NUM,
                plus: true // 开启别名功能
            })
        });
        const mails = res.data.items;
        if (!mails || mails.length === 0) throw new Error("未获取到邮箱");

        currentMail = mails[0];
        emailBox.textContent = currentMail;
        return currentMail;
    } catch (err) {
        setMsg(`生成邮箱失败：${err.message}`, true);
        throw err;
    }
}

// 3. 获取收件箱列表
async function getInbox() {
    if (!currentMail) {
        inboxList.innerHTML = '<div class="empty-tip">暂无邮箱，先生成邮箱</div>';
        return;
    }
    try {
        const res = await apiReq("/gmail/inbox", {
            method: "POST",
            body: JSON.stringify({
                email: currentMail
            })
        });
        const list = res.data || [];
        renderInbox(list);
        return list;
    } catch (err) {
        inboxList.innerHTML = `<div class="empty-tip">读取收件箱失败：${err.message}</div>`;
    }
}

// 4. 获取单封邮件详情
async function getMailDetail(msgId) {
    try {
        const res = await apiReq("/gmail/message", {
            method: "POST",
            body: JSON.stringify({ messageId: msgId })
        });
        return res.data.body || res.data.html || "无邮件内容";
    } catch (e) {
        return "无法读取邮件详情";
    }
}

// 5. 删除单封邮件
async function delMail(msgId) {
    try {
        await apiReq("/gmail/message", {
            method: "DELETE",
            body: JSON.stringify({ messageId: msgId })
        });
        setMsg("邮件已删除");
        await getInbox();
    } catch (e) {
        setMsg(`删除失败：${e.message}`, true);
    }
}

// 渲染收件箱
async function renderInbox(list) {
    if (list.length === 0) {
        inboxList.innerHTML = '<div class="empty-tip">暂无新邮件</div>';
        return;
    }
    let html = "";
    for (const item of list) {
        const detail = await getMailDetail(item.messageId);
        const timeStr = new Date(item.time * 1000).toLocaleString();
        html += `
        <div class="email-item">
            <div class="email-sub">${item.subject || "无主题"}</div>
            <div class="email-meta">发件人：${item.from || "未知"} | ${timeStr}
                <button class="btn-default" style="padding:2px 8px;font-size:12px" onclick="delMail('${item.messageId}')">删除</button>
            </div>
            <div class="email-body">${detail}</div>
        </div>
        `;
    }
    inboxList.innerHTML = html;
}

// 清空所有邮件
async function clearAllMail() {
    const list = await getInbox();
    if (!list || list.length === 0) {
        setMsg("收件箱已是空状态");
        return;
    }
    for (const item of list) {
        await delMail(item.messageId);
    }
    setMsg("收件箱已清空");
}

// ====================== 事件绑定 & 初始化 ======================
genCopyBtn.addEventListener("click", async () => {
    genCopyBtn.disabled = true;
    genCopyBtn.textContent = "处理中...";
    try {
        const mail = await genGmail();
        await copyText(mail);
        setMsg(`已生成并复制：${mail}`);
        await getInbox();
    } catch (e) {
        // 异常已在内部提示
    } finally {
        genCopyBtn.disabled = false;
        genCopyBtn.textContent = "生成并复制新邮箱";
    }
});

refreshBtn.addEventListener("click", async () => {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "刷新中...";
    await getInbox();
    refreshBtn.disabled = false;
    refreshBtn.textContent = "手动刷新";
});

clearBtn.addEventListener("click", async () => {
    if (!confirm("确定清空全部邮件？")) return;
    clearBtn.disabled = true;
    clearBtn.textContent = "清空中...";
    await clearAllMail();
    clearBtn.disabled = false;
    clearBtn.textContent = "清空收件箱";
});

// 启动自动刷新
function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
        getInbox();
    }, CONFIG.REFRESH_INTERVAL);
}

// 页面初始化
async function init() {
    try {
        await getToken();
        genCopyBtn.disabled = false;
        await genGmail();
        await getInbox();
        startAutoRefresh();
    } catch (e) {
        setMsg("初始化失败，请检查网络与配置", true);
    }
}

window.onload = init;
window.onbeforeunload = () => {
    if (refreshTimer) clearInterval(refreshTimer);
};
</script>
</body>
</html>
